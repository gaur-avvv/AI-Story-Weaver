
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novellaio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://js.puter.com/v2/"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Cinzel:wght@400..800&family=Inter:wght@300..800&family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&family=Lora:ital,wght@0,400..700;1,400..700&family=MedievalSharp&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Outfit:wght@300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #0b0f19; /* Deep refined dark slate */
        color: #f1f5f9;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        overflow-x: hidden;
      }
      .font-display {
        font-family: 'Playfair Display', serif;
      }
      .font-serif {
        font-family: 'Playfair Display', serif;
      }
      .font-cinzel {
        font-family: 'Cinzel', serif;
      }
      .font-merriweather {
        font-family: 'Merriweather', serif;
      }
      .font-lora {
        font-family: 'Lora', serif;
      }
      .font-outfit {
        font-family: 'Outfit', sans-serif;
      }
      .font-inter {
        font-family: 'Inter', sans-serif;
      }
      .font-fantasy {
        font-family: 'MedievalSharp', cursive;
      }
      .font-handwriting {
        font-family: 'Caveat', cursive;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      /* Minimal custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.4);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(168, 85, 247, 0.25);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(168, 85, 247, 0.5);
      }
      @keyframes gradient-xy {
        0%, 100% {
            background-size: 300% 300%;
            background-position: left center;
        }
        50% {
            background-size: 200% 200%;
            background-position: right center;
        }
      }
      .animate-gradient-xy {
        animation: gradient-xy 15s ease infinite;
      }
      .animate-gradient-glow {
        animation: gradient-xy 4s ease infinite;
      }
      @keyframes pulse-slow {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
      .animate-pulse-slow {
        animation: pulse-slow 8s ease-in-out infinite;
      }

      /* Skeleton Shimmer Animation */
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .animate-shimmer {
        position: relative;
        overflow: hidden;
      }
      .animate-shimmer::after {
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        transform: translateX(-100%);
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0,
          rgba(255, 255, 255, 0.08) 20%,
          rgba(255, 255, 255, 0.2) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        animation: shimmer 1.8s infinite;
        content: '';
      }

      /* CSS Container Query Support */
      .story-container {
        container-type: inline-size;
        container-name: storyContainer;
      }

      .paragraph-card-container {
        container-type: inline-size;
        container-name: paragraphCard;
      }

      @container paragraphCard (max-width: 540px) {
        .card-inner-padding {
          padding: 1rem !important;
        }
        .card-media-frame {
          aspect-ratio: 16 / 9 !important;
          margin-bottom: 1rem !important;
          border-radius: 1.25rem !important;
        }
        .card-paragraph-text {
          font-size: 1.05rem !important;
          line-height: 1.65 !important;
        }
      }

      @container storyContainer (max-width: 500px) {
        .choice-button {
          padding: 0.875rem !important;
        }
        .choice-text {
          font-size: 0.95rem !important;
        }
      }

      /* Clean Print Stylesheet */
      @media print {
        @page {
          margin: 1.5cm;
          size: auto;
        }
        body {
          background-color: #ffffff !important;
          color: #0f172a !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        .no-print,
        header,
        nav,
        footer,
        .AudioController,
        .SettingsPanel,
        .VfxQuickHud,
        .VfxStudioPanel,
        .VfxScreenOverlays,
        .story-input-container,
        .action-button-bar,
        .toast-container,
        .modal-overlay,
        button,
        input,
        select {
          display: none !important;
        }
        .story-container {
          padding: 0 !important;
          margin: 0 !important;
          width: 100% !important;
          max-width: 100% !important;
        }
        .paragraph-card-container {
          box-shadow: none !important;
          background: #ffffff !important;
          border: 1px solid #cbd5e1 !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
          margin-bottom: 2rem !important;
          border-radius: 1.25rem !important;
        }
        .card-paragraph-text {
          color: #0f172a !important;
          text-shadow: none !important;
          font-size: 1.25rem !important;
          line-height: 1.8 !important;
        }
        .card-media-frame {
          box-shadow: none !important;
          border: 1px solid #e2e8f0 !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
